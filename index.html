<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OvuPac</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    background:
    radial-gradient(circle at center,#3b003b 0%, #120012 45%, #05000a 100%);
    font-family: "Courier New", monospace;
    overflow:hidden;
    color:white;
}

#gameWrapper{
    width:100vw;
    height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;
}

#topHUD{
    margin-top:20px;

    display:flex;
    gap:24px;
}

.hudBox{
    background:#130018;

    border:3px solid #ff00aa;

    border-radius:18px;

    padding:14px 28px;

    font-size:20px;

    box-shadow:
    0 0 10px #ff00aa,
    0 0 30px #ff00aa55;
}

#mainArea{
    margin-top:20px;

    display:flex;
    gap:20px;
}

#gameCanvas{
    background:black;

    border:4px solid #ff0088;

    box-shadow:
    0 0 20px #ff0088,
    0 0 60px #ff008855;

    image-rendering: pixelated;
}

#powers{
    width:240px;

    background:#0b0012;

    border:3px solid #ff00aa;

    border-radius:20px;

    padding:20px;

    box-shadow:
    0 0 20px #ff00aa88;
}

#powers h2{
    margin-top:0;

    color:#ff00aa;

    font-size:36px;
}

.power{
    margin-bottom:22px;
}

.bar{
    width:100%;
    height:18px;

    background:#2a002f;

    border-radius:10px;

    overflow:hidden;
}

.fill{
    height:100%;
    width:0%;

    background:#ff00aa;
}

</style>
</head>

<body>

<div id="gameWrapper">

    <div id="topHUD">

        <div class="hudBox">
            ❤️ Lives:
            <span id="lives">3</span>
        </div>

        <div class="hudBox">
            ⭐ Score:
            <span id="score">0</span>
        </div>

        <div class="hudBox">
            🧠 Questions:
            <span id="questions">0</span>
        </div>

    </div>

    <div id="mainArea">

        <canvas id="gameCanvas"></canvas>

        <div id="powers">

            <h2>⚡ POWERS</h2>

            <div class="power">
                [1] Estrogen
                <div class="bar">
                    <div class="fill" id="power1"></div>
                </div>
            </div>

            <div class="power">
                [2] LH
                <div class="bar">
                    <div class="fill" id="power2"></div>
                </div>
            </div>

            <div class="power">
                [3] FSH
                <div class="bar">
                    <div class="fill" id="power3"></div>
                </div>
            </div>

            <div class="power">
                [4] Progesterone
                <div class="bar">
                    <div class="fill" id="power4"></div>
                </div>
            </div>

            <div class="power">
                [5] Ovulation
                <div class="bar">
                    <div class="fill" id="power5"></div>
                </div>
            </div>

            <div class="power">
                [6] Follicular
                <div class="bar">
                    <div class="fill" id="power6"></div>
                </div>
            </div>

        </div>

    </div>

</div>

<script src="questions.js"></script>
<script src="game.js"></script>

</body>
</html>
