<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OvuPac</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- START SCREEN -->
    <div id="startScreen">

        <div class="menu-box">

            <h1 class="title">
                🌸 OvuPac 🌸
            </h1>

            <p class="subtitle">
                Arcade hormonal retro
            </p>

            <button id="playBtn">
                JUGAR
            </button>

        </div>

    </div>

    <!-- GAME -->
    <div id="gameUI" style="display:none;">

        <!-- TOP -->
        <div class="stats">

            <div class="stat-box">
                ❤️ Lives:
                <span id="lives">3</span>
            </div>

            <div class="stat-box">
                ⭐ Score:
                <span id="score">0</span>
            </div>

            <div class="stat-box">
                🧠 Questions:
                <span id="questions">0</span>
            </div>

        </div>

        <!-- MAIN -->
        <div class="game-layout">

            <!-- CANVAS -->
            <div class="game-container">

                <canvas id="gameCanvas"
                    width="1100"
                    height="720">
                </canvas>

            </div>

            <!-- POWERS -->
            <div class="powers-panel">

                <h2>⚡ POWERS</h2>

                <div class="power">
                    <span>[1] Estrogen</span>
                    <div class="bar"><div id="bar1"></div></div>
                </div>

                <div class="power">
                    <span>[2] LH</span>
                    <div class="bar"><div id="bar2"></div></div>
                </div>

                <div class="power">
                    <span>[3] FSH</span>
                    <div class="bar"><div id="bar3"></div></div>
                </div>

                <div class="power">
                    <span>[4] Progesterone</span>
                    <div class="bar"><div id="bar4"></div></div>
                </div>

                <div class="power">
                    <span>[5] Ovulation</span>
                    <div class="bar"><div id="bar5"></div></div>
                </div>

                <div class="power">
                    <span>[6] Follicular</span>
                    <div class="bar"><div id="bar6"></div></div>
                </div>

            </div>

        </div>

    </div>

    <!-- QUESTION MODAL -->
    <div id="questionModal" class="hidden">

        <div class="question-box">

            <h2 id="questionText"></h2>

            <div id="answers"></div>

        </div>

    </div>

    <!-- IMPORTANT -->
    <script src="questions.js" defer></script>
    <script src="game.js" defer></script>

</body>
</html>
