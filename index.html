<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OvuPac</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- MENU -->

<div id="menuScreen">

    <div class="menu-box">

        <h1>🌸 OvuPac 🌸</h1>

        <p>Retro Hormonal Arcade</p>

        <button id="playButton">
            PLAY
        </button>

    </div>

</div>

<!-- GAME -->

<div id="gameWrapper">

    <!-- LEFT SIDE -->

    <div id="leftPanel">

        <!-- HUD -->

        <div id="hud">

            <div class="hud-box">
                ❤️ Lives:
                <span id="lives">3</span>
            </div>

            <div class="hud-box">
                ⭐ Score:
                <span id="score">0</span>
            </div>

            <div class="hud-box">
                🧠 Questions:
                <span id="questions">0</span>
            </div>

        </div>

        <!-- CANVAS -->

        <canvas
            id="gameCanvas"
            width="1120"
            height="760">
        </canvas>

    </div>

    <!-- RIGHT PANEL -->

    <div id="rightPanel">

        <h2>⚡ POWERS</h2>

        <div class="power">

            <div class="power-title">
                Estrogen
            </div>

            <div class="bar">
                <div
                    class="fill"
                    id="estrogenFill">
                </div>
            </div>

        </div>

        <div class="power">

            <div class="power-title">
                LH
            </div>

            <div class="bar">
                <div
                    class="fill"
                    id="lhFill">
                </div>
            </div>

        </div>

        <div class="power">

            <div class="power-title">
                FSH
            </div>

            <div class="bar">
                <div
                    class="fill"
                    id="fshFill">
                </div>
            </div>

        </div>

        <div class="power">

            <div class="power-title">
                Progesterone
            </div>

            <div class="bar">
                <div
                    class="fill"
                    id="progFill">
                </div>
            </div>

        </div>

    </div>

</div>

<!-- QUESTION WINDOW -->

<div id="questionBox" style="display:none;">

    <div id="questionText">
        Question
    </div>

    <button
        class="answerBtn"
        id="answer1">
    </button>

    <button
        class="answerBtn"
        id="answer2">
    </button>

    <button
        class="answerBtn"
        id="answer3">
    </button>

    <button
        class="answerBtn"
        id="answer4">
    </button>

</div>

<!-- SCRIPTS -->

<script src="questions.js"></script>
<script src="game.js"></script>
<script src="enhancements.js"></script>

</body>
</html>
