<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OVUPAC</title>

<style>

/* =========================
   GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:
radial-gradient(circle at top,#2c003e 0%,#120018 30%,#05010d 80%);

overflow:hidden;

font-family:Courier New, monospace;

color:white;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

}

/* CRT EFFECT */

body::after{

content:"";

position:fixed;

inset:0;

background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,.03),
rgba(255,255,255,.03) 1px,
transparent 1px,
transparent 3px
);

pointer-events:none;

opacity:.25;

}

/* =========================
   MENU
========================= */

#menuScreen{

position:fixed;

inset:0;

display:flex;
justify-content:center;
align-items:center;

z-index:50;

background:
radial-gradient(circle,#24002f 0%,#090011 80%);

}

.menuCard{

width:700px;

max-width:90%;

background:
linear-gradient(
180deg,
rgba(30,0,40,.95),
rgba(5,0,10,.95)
);

border:4px solid #ff006e;

border-radius:30px;

padding:50px;

text-align:center;

box-shadow:
0 0 20px #ff006e,
0 0 60px #ff006e,
0 0 120px rgba(255,0,110,.4);

}

.gameTitle{

font-size:82px;

font-weight:bold;

margin-bottom:20px;

color:#ff006e;

text-shadow:
0 0 15px #ff006e,
0 0 35px #ff006e;

letter-spacing:6px;

}

.subtitle{

font-size:26px;

color:#74c0ff;

margin-bottom:35px;

text-shadow:
0 0 10px #74c0ff;

}

.menuInfo{

font-size:24px;

line-height:2;

color:#ffd6ff;

margin-bottom:45px;

}

#playBtn{

border:none;

background:
linear-gradient(
90deg,
#ff006e,
#ff4da6
);

color:white;

padding:20px 70px;

font-size:34px;

font-weight:bold;

border-radius:20px;

cursor:pointer;

transition:.2s;

box-shadow:
0 0 20px #ff006e,
0 0 40px #ff006e;

}

#playBtn:hover{

transform:scale(1.08);

}

/* =========================
   GAME
========================= */

#gameScreen{

display:none;

width:100vw;
height:100vh;

padding:12px;

}

/* HUD */

.topHUD{

display:flex;

justify-content:center;

gap:20px;

margin-bottom:12px;

}

.hudBox{

background:
rgba(5,5,20,.95);

border:2px solid #ff006e;

padding:12px 26px;

border-radius:16px;

font-size:22px;

color:#ffe6f2;

box-shadow:
0 0 12px #ff006e;

}

/* LAYOUT */

.gameLayout{

display:flex;

justify-content:center;

align-items:flex-start;

gap:18px;

}

/* CANVAS */

canvas{

background:black;

border:4px solid #ff006e;

border-radius:22px;

box-shadow:
0 0 20px #ff006e,
0 0 50px #ff006e,
0 0 100px rgba(255,0,110,.3);

}

/* SIDEBAR */

.sidebar{

width:290px;

background:
rgba(5,0,10,.95);

border:3px solid #ff006e;

border-radius:22px;

padding:22px;

box-shadow:
0 0 25px #ff006e;

}

.sidebar h2{

font-size:32px;

margin-bottom:25px;

color:#ff006e;

text-shadow:
0 0 10px #ff006e;

}

.power{

margin-bottom:22px;

font-size:18px;

color:#ffd6ff;

}

.bar{

width:100%;
height:18px;

background:#180020;

border-radius:14px;

overflow:hidden;

margin-top:8px;

border:1px solid #ff006e;

}

.fill{

width:0%;
height:100%;

background:
linear-gradient(
90deg,
#ff006e,
#ff66b3
);

box-shadow:
0 0 15px #ff006e;

}

/* QUESTIONS */

#questionBox{

position:fixed;

inset:0;

display:none;

justify-content:center;
align-items:center;

background:rgba(0,0,0,.8);

z-index:200;

backdrop-filter:blur(5px);

}

.questionCard{

width:700px;

max-width:90%;

background:
linear-gradient(
180deg,
#190024,
#05010d
);

border:4px solid #ff006e;

border-radius:28px;

padding:40px;

box-shadow:
0 0 30px #ff006e,
0 0 70px rgba(255,0,110,.5);

}

#questionText{

font-size:30px;

line-height:1.5;

margin-bottom:35px;

color:#ffe6f2;

}

.option{

background:
rgba(25,15,50,.9);

border:2px solid #7b2cbf;

padding:18px;

border-radius:16px;

margin-bottom:16px;

font-size:20px;

cursor:pointer;

transition:.2s;

}

.option:hover{

transform:scale(1.02);

background:
rgba(50,20,70,.95);

border-color:#ff006e;

box-shadow:
0 0 15px #ff006e;

}

</style>

</head>

<body>

<!-- MENU -->

<div id="menuScreen">

<div class="menuCard">

<div class="gameTitle">
OVUPAC
</div>

<div class="subtitle">
RETRO HORMONAL ARCADE
</div>

<div class="menuInfo">

🧠 Responde preguntas<br>
⚡ Desbloquea poderes hormonales<br>

🌙 Juego infinito synthwave retro

</div>

<button id="playBtn">
JUGAR
</button>

</div>

</div>

<!-- GAME -->

<div id="gameScreen">

<div class="topHUD">

<div class="hudBox">
❤️ Vidas:
<span id="lives">3</span>
</div>

<div class="hudBox">
⭐ Puntos:
<span id="score">0</span>
</div>

<div class="hudBox">
🧠 Preguntas:
<span id="questions">0</span>
</div>

</div>

<div class="gameLayout">

<canvas id="gameCanvas"></canvas>

<div class="sidebar">

<h2>⚡ PODERES</h2>

<div class="power">
[1] Estrógeno
<div class="bar">
<div class="fill" id="power1"></div>
</div>
</div>

<div class="power">
[2] LH
<div class="bar">
<div class="fill" id="power2"></div>
</div>
</div>

<div class="power">
[3] FSH
<div class="bar">
<div class="fill" id="power3"></div>
</div>
</div>

<div class="power">
[4] Progesterona
<div class="bar">
<div class="fill" id="power4"></div>
</div>
</div>

<div class="power">
[5] Ovulación
<div class="bar">
<div class="fill" id="power5"></div>
</div>
</div>

<div class="power">
[6] Fase Folicular
<div class="bar">
<div class="fill" id="power6"></div>
</div>
</div>

</div>

</div>

</div>

<!-- QUESTIONS -->

<div id="questionBox">

<div class="questionCard">

<div id="questionText"></div>

<div id="options"></div>

</div>

</div>

<script src="game.js"></script>

</body>
</html>
