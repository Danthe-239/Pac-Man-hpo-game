<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OvuPac</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- MENU -->
  <div id="startScreen">
    <div class="menu-card">

      <h1>🌸 OvuPac 🌸</h1>
      <p>Retro hormonal arcade</p>

      <button id="playBtn">JUGAR</button>

    </div>
  </div>

  <!-- GAME -->
  <div id="gameContainer">

    <div class="hud">

      <div class="hud-box">
        ❤️ Lives: <span id="lives">3</span>
      </div>

      <div class="hud-box">
        ⭐ Score: <span id="score">0</span>
      </div>

      <div class="hud-box">
        🧠 Questions: <span id="questions">0</span>
      </div>

    </div>

    <div class="game-layout">

      <canvas id="gameCanvas" width="960" height="640"></canvas>

      <div class="powers">

        <h2>⚡ POWERS</h2>

        <div class="power">
          <span>Estrogen</span>
          <div class="bar"><div id="bar1"></div></div>
        </div>

        <div class="power">
          <span>LH</span>
          <div class="bar"><div id="bar2"></div></div>
        </div>

        <div class="power">
          <span>FSH</span>
          <div class="bar"><div id="bar3"></div></div>
        </div>

        <div class="power">
          <span>Progesterone</span>
          <div class="bar"><div id="bar4"></div></div>
        </div>

      </div>

    </div>

  </div>

  <!-- QUESTION MODAL -->
  <div id="questionModal">

    <div class="question-box">

      <h2 id="questionText"></h2>

      <div id="answers"></div>

    </div>

  </div>

  <script src="game.js"></script>

</body>
</html>
