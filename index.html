<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>OvuPac</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>

  <div class="hud">

    <div class="box">
      ❤️ Lives:
      <span id="lives">3</span>
    </div>

    <div class="box">
      ⭐ Score:
      <span id="score">0</span>
    </div>

    <div class="box">
      🧠 Questions:
      <span id="questions">0</span>
    </div>

  </div>

  <div class="game-container">

    <canvas id="gameCanvas"></canvas>

    <div class="powers">

      <h2>⚡ POWERS</h2>

      <div class="power">
        <p>[1] Estrogen</p>
        <div class="bar">
          <div id="bar-estrogen" class="fill pink"></div>
        </div>
      </div>

      <div class="power">
        <p>[2] LH</p>
        <div class="bar">
          <div id="bar-lh" class="fill yellow"></div>
        </div>
      </div>

      <div class="power">
        <p>[3] FSH</p>
        <div class="bar">
          <div id="bar-fsh" class="fill blue"></div>
        </div>
      </div>

      <div class="power">
        <p>[4] Progesterone</p>
        <div class="bar">
          <div id="bar-progesterone" class="fill green"></div>
        </div>
      </div>

      <div class="power">
        <p>[5] Ovulation</p>
        <div class="bar">
          <div id="bar-ovulation" class="fill orange"></div>
        </div>
      </div>

      <div class="power">
        <p>[6] Follicular</p>
        <div class="bar">
          <div id="bar-follicular" class="fill purple"></div>
        </div>
      </div>

    </div>

  </div>

  <script src="questions.js"></script>
  <script src="game.js"></script>

</body>
</html>
