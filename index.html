<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OvuPac</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="menu">
    <h1>🌸 OvuPac 🌸</h1>
    <p>Retro Hormonal Arcade</p>

    <button id="playButton">PLAY</button>
</div>

<div id="gameUI" style="display:none;">

    <div class="topbar">
        <div>❤️ Lives: <span id="lives">3</span></div>
        <div>⭐ Score: <span id="score">0</span></div>
        <div>🧠 Questions: <span id="questions">0</span></div>
    </div>

    <div class="gameContainer">

        <canvas id="gameCanvas" width="960" height="640"></canvas>

        <div class="powers">
            <h2>⚡ POWERS</h2>

            <div>[1] Estrogen</div>
            <div class="bar"><div id="bar1"></div></div>

            <div>[2] LH</div>
            <div class="bar"><div id="bar2"></div></div>

            <div>[3] FSH</div>
            <div class="bar"><div id="bar3"></div></div>

            <div>[4] Progesterone</div>
            <div class="bar"><div id="bar4"></div></div>

            <div>[5] Ovulation</div>
            <div class="bar"><div id="bar5"></div></div>

            <div>[6] Follicular</div>
            <div class="bar"><div id="bar6"></div></div>

        </div>

    </div>

</div>

<script src="questions.js"></script>
<script src="game.js"></script>

</body>
</html>
