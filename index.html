<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OvuPac</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

</head>

<body>

<!-- PANTALLA INICIO -->

<div id="startScreen">

    <div class="startCard">

        <h1>🌸 OvuPac 🌸</h1>

        <p class="subtitle">
            Ciclo Menstrual & Eje HPO
        </p>

        <div class="info">

            <p>🧠 Responde preguntas</p>
            <p>⚡ Desbloquea poderes hormonales</p>
            <p>🧬 Sobrevive a los espermas IA</p>
            <p>💖 Juego infinito retro arcade</p>

        </div>

        <button id="playBtn">
            JUGAR
        </button>

    </div>

</div>

<!-- HUD -->

<div id="hud">

    <div class="hudBox">
        ❤️ Vidas:
        <span id="lives">3</span>
    </div>

    <div class="hudBox">
        ⭐ Puntos:
        <span id="score">0</span>
    </div>

    <div class="hudBox">
        🧠 Preguntas:
        <span id="questionCount">0</span>
    </div>

</div>

<!-- PODERES -->

<div id="powersPanel">

    <h3>⚡ PODERES</h3>

    <div class="powerItem">

        <p>[1] Estrógeno</p>

        <div class="bar">
            <div id="bar1"></div>
        </div>

    </div>

    <div class="powerItem">

        <p>[2] LH</p>

        <div class="bar">
            <div id="bar2"></div>
        </div>

    </div>

    <div class="powerItem">

        <p>[3] FSH</p>

        <div class="bar">
            <div id="bar3"></div>
        </div>

    </div>

    <div class="powerItem">

        <p>[4] Progesterona</p>

        <div class="bar">
            <div id="bar4"></div>
        </div>

    </div>

    <div class="powerItem">

        <p>[5] Ovulación</p>

        <div class="bar">
            <div id="bar5"></div>
        </div>

    </div>

    <div class="powerItem">

        <p>[6] Fase Folicular</p>

        <div class="bar">
            <div id="bar6"></div>
        </div>

    </div>

</div>

<!-- PREGUNTAS -->

<div id="questionModal" class="hidden">

    <div class="questionCard">

        <h2 id="questionText"></h2>

        <div id="answers"></div>

    </div>

</div>

<!-- GAME -->

<div id="gameContainer">

    <canvas id="game"></canvas>

</div>

<script src="game.js"></script>

</body>

</html>
