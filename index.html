<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OvuPac</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    background:#060010;
    overflow:hidden;
    font-family:Courier New;
    color:white;
}

#gameWrapper{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:20px;
    margin-top:20px;
}

#leftPanel{
    display:flex;
    flex-direction:column;
    align-items:center;
}

#hud{
    display:flex;
    gap:20px;
    margin-bottom:15px;
}

.hudBox{
    background:#120018;
    border:3px solid #ff0080;
    border-radius:15px;
    padding:12px 25px;
    font-size:18px;
    box-shadow:0 0 15px #ff0080;
}

#game{
    background:black;
    border:4px solid #ff0080;
    box-shadow:0 0 30px #ff0080;
    image-rendering:pixelated;
}

#powers{
    width:260px;
    background:#0b0014;
    border:3px solid #ff0080;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 25px #ff0080;
}

#powers h2{
    color:#ff0080;
}

.power{
    margin-bottom:20px;
}

.bar{
    width:100%;
    height:18px;
    background:#220022;
    border-radius:10px;
    overflow:hidden;
}

.fill{
    width:0%;
    height:100%;
    background:#ff0080;
}

</style>
</head>

<body>

<div id="gameWrapper">

    <div id="leftPanel">

        <div id="hud">

            <div class="hudBox">
                ❤️ Lives: <span id="lives">3</span>
            </div>

            <div class="hudBox">
                ⭐ Score: <span id="score">0</span>
            </div>

            <div class="hudBox">
                🧠 Questions: <span id="questions">0</span>
            </div>

        </div>

        <canvas id="game" width="960" height="640"></canvas>

    </div>

    <div id="powers">

        <h2>⚡ POWERS</h2>

        <div class="power">
            [1] Estrogen
            <div class="bar">
                <div class="fill" id="power1"></div>
            </div>
        </div>

        <div class="power">
            [2] LH
            <div class="bar">
                <div class="fill" id="power2"></div>
            </div>
        </div>

        <div class="power">
            [3] FSH
            <div class="bar">
                <div class="fill" id="power3"></div>
            </div>
        </div>

        <div class="power">
            [4] Progesterone
            <div class="bar">
                <div class="fill" id="power4"></div>
            </div>
        </div>

        <div class="power">
            [5] Ovulation
            <div class="bar">
                <div class="fill" id="power5"></div>
            </div>
        </div>

        <div class="power">
            [6] Follicular
            <div class="bar">
                <div class="fill" id="power6"></div>
            </div>
        </div>

    </div>

</div>

<script src="questions.js"></script>
<script src="game.js"></script>

</body>
</html>
