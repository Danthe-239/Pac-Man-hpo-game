<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OvuPac</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- MENU -->
<div id="menuScreen" class="menu-screen">
    <div class="menu-box">
        <h1 class="title">🌸 OvuPac 🌸</h1>

        <p class="subtitle">
            Retro Hormonal Arcade
        </p>

        <button id="playBtn" class="play-btn">
            PLAY
        </button>
    </div>
</div>

<!-- GAME -->
<div id="gameScreen" class="hidden">

    <div class="top-ui">

        <div class="ui-box">
            ❤️ Lives: <span id="lives">3</span>
        </div>

        <div class="ui-box">
            ⭐ Score: <span id="score">0</span>
        </div>

        <div class="ui-box">
            🧠 Questions: <span id="questionsAnswered">0</span>
        </div>

    </div>

    <div class="game-layout">

        <canvas id="gameCanvas" width="960" height="640"></canvas>

        <div class="powers-panel">

            <h2>⚡ POWERS</h2>

            <div class="power">
                <span>[1] Estrogen</span>
                <div class="bar">
                    <div id="power1" class="fill"></div>
                </div>
            </div>

            <div class="power">
                <span>[2] LH</span>
                <div class="bar">
                    <div id="power2" class="fill"></div>
                </div>
            </div>

            <div class="power">
                <span>[3] FSH</span>
                <div class="bar">
                    <div id="power3" class="fill"></div>
                </div>
            </div>

            <div class="power">
                <span>[4] Progesterone</span>
                <div class="bar">
                    <div id="power4" class="fill"></div>
                </div>
            </div>

            <div class="power">
                <span>[5] Ovulation</span>
                <div class="bar">
                    <div id="power5" class="fill"></div>
                </div>
            </div>

            <div class="power">
                <span>[6] Follicular</span>
                <div class="bar">
                    <div id="power6" class="fill"></div>
                </div>
            </div>

        </div>

    </div>

</div>

<!-- QUESTION BOX -->
<div id="questionBox" class="question-box hidden">

    <h2 id="questionText"></h2>

    <div class="answers">
        <button class="answer-btn" onclick="answerQuestion(0)" id="a0"></button>
        <button class="answer-btn" onclick="answerQuestion(1)" id="a1"></button>
        <button class="answer-btn" onclick="answerQuestion(2)" id="a2"></button>
        <button class="answer-btn" onclick="answerQuestion(3)" id="a3"></button>
    </div>

</div>

<script src="questions.js"></script>
<script src="game.js"></script>

</body>
</html>
